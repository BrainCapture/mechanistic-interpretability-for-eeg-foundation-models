<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NeurIPS 2026 — Figure 1 (3 directions)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F1EFE9; font-family: "Inter Tight", system-ui, sans-serif; }
  body { color: #111; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
<style>
  #export-btns {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    display: flex; gap: 8px;
  }
  .btn {
    padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
    background: #111; color: #fff; font-family: "Inter Tight", system-ui, sans-serif;
    font-size: 13px; font-weight: 500; letter-spacing: .01em;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    transition: background .15s;
  }
  .btn:hover { background: #333; }
  .btn:disabled { background: #888; cursor: default; }
  .btn-alt { background: #fff; color: #111; border: 1px solid #ddd; }
  .btn-alt:hover { background: #f4f4f4; }
  
  @media print {
    body * { visibility: hidden; }
    #figure-columns, #figure-columns * { visibility: visible; }
    #figure-columns { position: absolute; left: 0; top: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="export-btns">
  <button class="btn btn-alt" onclick="window.print()">Print to Vector PDF</button>
  <button class="btn" id="export-btn" onclick="exportFigure()">Export PNG</button>
</div>
<script>
function exportFigure() {
  const btn = document.getElementById('export-btn');
  const target = document.getElementById('figure-columns');
  if (!target) return;
  btn.disabled = true;
  btn.textContent = 'Exporting…';
  // scale: 8 → ~768 DPI at 96 DPI screen baseline, well above 600 DPI print standard.
  html2canvas(target, { scale: 8, useCORS: true, backgroundColor: '#ffffff', imageTimeout: 0 }).then((canvas) => {
    const a = document.createElement('a');
    a.download = 'figure-1.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    btn.disabled = false;
    btn.textContent = 'Export PNG';
  }).catch(err => {
    console.error(err);
    alert('Export failed: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Export PNG';
  });
}
</script>

<script type="text/babel" src="src/design-canvas.jsx"></script>
<script type="text/babel" src="src/figure-shared.jsx"></script>
<script type="text/babel" src="src/figure-clean.jsx"></script>

<script type="text/babel">
const COLORS = { spectral: '#2D6FB5', sae: '#3F9A4A', tcav: '#E08A1F', steer: '#C8362F' };

function App() {
  return (
    <DesignCanvas>
      <DCSection id="primary" title="NeurIPS 2026 — Figure 1" subtitle="Clean four-strip layout in the style of the reference. Diagrammatic, minimal prose.">
        <DCArtboard id="clean" label="Four-strip pipeline" width={1194} height={1000}>
          <FigureClean colors={COLORS} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
