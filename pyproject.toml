[project]
name = "mecheeg"
version = "1.0.0"
description = "Mechanistic Interpretability of EEG Foundation Models via Sparse Autoencoders (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.12, <3.13"
authors = [
  { name = "William Lehn-Schiøler" },
  { name = "Magnus Ruud Kjær" },
  { name = "Rahul Thapa" },
  { name = "Magnus Guldberg Pedersen" },
  { name = "Anton Storgaard Mosquera" },
  { name = "Nick Williams" },
  { name = "Andreas Brink-Kjær" },
  { name = "Radu Gatej" },
  { name = "Tue Lehn-Schiøler" },
  { name = "Sándor Beniczky" },
  { name = "Sadasivan Puthusserypady" },
  { name = "James Zou" },
  { name = "Lars Kai Hansen" },
]
license = { text = "PolyForm-Noncommercial-1.0.0" }

dependencies = [
  "torch==2.5.0+cu118",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "scikit-learn>=1.8.0",
  "h5py>=3.15.1",
  "umap-learn>=0.5.11",
  "einops>=0.8.1",
  "tqdm>=4.60.0",
  # Encoder backends (REVE uses transformers)
  "transformers>=4.40.0",
]

[dependency-groups]
# Interactive Streamlit explorer (`uv run streamlit run app/main.py`)
app = [
  "streamlit>=1.43.0",
  "plotly>=6.0.0",
]
dev = [
  "ruff",
  "isort",
  "mypy",
  "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
type = "index"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires    = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
